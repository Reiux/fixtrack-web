<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Book a Repair | FixTrack</title>
    <meta name="description" content="Submit a request to have your device repaired by FixTrack professionals." />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  </head>
  <body class="bg-background">
    <div class="flex min-h-screen flex-col">
      <!-- Standard Navigation Header -->
      <header class="sticky top-0 z-30 border-b border-border bg-background/85 backdrop-blur">
        <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-4 px-4 py-3 sm:px-6">
          <a href="index.html" class="flex min-w-0 items-center gap-2 group">
            <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-primary text-primary-foreground group-hover:scale-105 transition-transform">
              <i data-lucide="wrench" class="h-4 w-4"></i>
            </span>
            <span class="truncate font-display text-lg font-bold">FixTrack</span>
          </a>

          <div class="flex items-center gap-2 md:order-3">
            <button type="button" data-theme-toggle aria-label="Toggle dark mode" class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-lg border border-border bg-card text-muted-foreground transition-colors hover:bg-secondary hover:text-foreground"></button>
            <button type="button" id="mobile-menu-btn" class="flex md:hidden h-9 w-9 shrink-0 items-center justify-center rounded-lg border border-border bg-card text-muted-foreground transition-colors hover:bg-secondary hover:text-foreground">
              <i data-lucide="menu" class="h-4 w-4"></i>
            </button>
          </div>

          <nav id="mobile-menu" class="hidden w-full flex-col items-center gap-4 border-t border-border pt-4 pb-2 md:order-2 md:flex md:w-auto md:flex-row md:gap-6 md:border-0 md:p-0">
            <a href="index.html" class="text-sm font-medium text-muted-foreground hover:text-foreground transition-colors">Home</a>
            <a href="login.html" class="text-sm text-muted-foreground transition-colors hover:text-foreground">Admin Login</a>
          </nav>
        </div>
      </header>

      <!-- Form Content -->
      <main class="flex-1 py-12 sm:py-20 px-4 sm:px-6">
        <div class="mx-auto max-w-2xl panel p-6 sm:p-10">
          <div class="text-center mb-10">
            <h1 class="text-3xl font-bold">Book a Repair</h1>
            <p class="mt-2 text-sm text-muted-foreground">Fill out the details below to generate a new repair ticket.</p>
          </div>

          <!-- Academic Form Structure -->
          <form action="status.html" method="GET" class="space-y-6">
            
            <!-- Personal Details Group -->
            <fieldset class="space-y-4 rounded-lg border border-border p-4">
              <legend class="px-2 text-sm font-bold text-primary">Customer Information</legend>
              
              <div class="grid gap-4 sm:grid-cols-2">
                <div>
                  <label for="fullname" class="block text-sm font-bold mb-1">Full Name</label>
                  <input id="fullname" name="fullname" type="text" required class="w-full rounded-lg border border-input bg-card py-2.5 px-3 text-sm outline-none focus:ring-2 focus:ring-ring transition-shadow" />
                </div>
                <div>
                  <label for="phone" class="block text-sm font-bold mb-1">Phone Number</label>
                  <input id="phone" name="phone" type="tel" required class="w-full rounded-lg border border-input bg-card py-2.5 px-3 text-sm outline-none focus:ring-2 focus:ring-ring transition-shadow" />
                </div>
              </div>

              <div>
                <label for="email" class="block text-sm font-bold mb-1">Email Address</label>
                <input id="email" name="email" type="email" required class="w-full rounded-lg border border-input bg-card py-2.5 px-3 text-sm outline-none focus:ring-2 focus:ring-ring transition-shadow" />
              </div>
            </fieldset>

            <!-- Device Details Group -->
            <fieldset class="space-y-4 rounded-lg border border-border p-4">
              <legend class="px-2 text-sm font-bold text-primary">Device Details</legend>
              
              <div>
                <label for="device_type" class="block text-sm font-bold mb-1">Device Category</label>
                <select id="device_type" name="device_type" required class="w-full rounded-lg border border-input bg-card py-2.5 px-3 text-sm outline-none focus:ring-2 focus:ring-ring transition-shadow appearance-none">
                  <option value="" disabled selected>Select a category...</option>
                  <option value="smartphone">Smartphone</option>
                  <option value="laptop">Laptop</option>
                  <option value="tablet">Tablet</option>
                  <option value="smartwatch">Smartwatch</option>
                </select>
              </div>

              <div>
                <label for="device_model" class="block text-sm font-bold mb-1">Exact Device Model</label>
                <input id="device_model" name="device_model" type="text" required class="w-full rounded-lg border border-input bg-card py-2.5 px-3 text-sm outline-none focus:ring-2 focus:ring-ring transition-shadow" />
              </div>

              <div>
                <label for="issue_desc" class="block text-sm font-bold mb-1">Describe the Issue</label>
                <textarea id="issue_desc" name="issue_desc" rows="4" required class="w-full rounded-lg border border-input bg-card py-3 px-4 text-sm outline-none focus:ring-2 focus:ring-ring transition-shadow"></textarea>
              </div>
            </fieldset>

            <button type="submit" class="w-full flex items-center justify-center gap-2 rounded-lg bg-primary px-5 py-3.5 text-sm font-bold text-primary-foreground hover:opacity-90 transition-opacity hover:-translate-y-0.5 transform">
              <i data-lucide="send" class="h-4 w-4"></i> Submit Repair Request
            </button>
          </form>
        </div>
      </main>

      <footer class="border-t border-border bg-surface py-5 text-center text-xs text-muted-foreground mt-auto">
        © <span id="year"></span> FixTrack. All rights reserved.
      </footer>
    </div>
  </body>
</html>
