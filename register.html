<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Technician Registration | FixTrack</title>
    <meta name="description" content="Request access to the FixTrack technician dashboard." />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  </head>
  <body class="bg-background">
    <div class="flex min-h-screen">
      
      <div class="flex w-full flex-col justify-center px-4 py-12 sm:px-6 lg:w-1/2 lg:flex-none lg:px-20 xl:px-24">
        <div class="mx-auto w-full max-w-sm lg:w-96">
          <div class="flex items-center gap-2">
            <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-primary text-primary-foreground">
              <i data-lucide="wrench" class="h-4 w-4"></i>
            </span>
            <span class="font-display text-xl font-bold">FixTrack</span>
          </div>
          
          <h2 class="mt-8 text-2xl font-bold leading-9 tracking-tight">Request Access</h2>
          
          <div class="mt-4 rounded-md border border-accent/20 bg-accent/10 p-4">
            <div class="flex">
              <div class="shrink-0">
                <i data-lucide="info" class="h-5 w-5 text-accent"></i>
              </div>
              <div class="ml-3">
                <p class="text-sm text-accent">
                  Your registration requires approval from the store owner. You will not be able to log in until your details have been reviewed and authorized.
                </p>
              </div>
            </div>
          </div>

          <div class="mt-8">
            <form action="login.html" method="GET" class="space-y-5">
              
              <div>
                <label for="fullname" class="block text-sm font-medium leading-6">Full Name</label>
                <div class="mt-2">
                  <input id="fullname" name="fullname" type="text" required class="block w-full rounded-lg border border-input bg-card py-2.5 px-3 text-sm outline-none focus:ring-2 focus:ring-ring" />
                </div>
              </div>

              <div>
                <label for="email" class="block text-sm font-medium leading-6">Company Email Address</label>
                <div class="mt-2">
                  <input id="email" name="email" type="email" autocomplete="email" required class="block w-full rounded-lg border border-input bg-card py-2.5 px-3 text-sm outline-none focus:ring-2 focus:ring-ring" />
                </div>
              </div>
              
              <div>
                <label for="employee_id" class="block text-sm font-medium leading-6">Employee ID / Role</label>
                <div class="mt-2">
                  <input id="employee_id" name="employee_id" type="text" required class="block w-full rounded-lg border border-input bg-card py-2.5 px-3 text-sm outline-none focus:ring-2 focus:ring-ring" />
                </div>
              </div>

              <div>
                <label for="password" class="block text-sm font-medium leading-6">Create Password</label>
                <div class="mt-2">
                  <input id="password" name="password" type="password" required class="block w-full rounded-lg border border-input bg-card py-2.5 px-3 text-sm outline-none focus:ring-2 focus:ring-ring" />
                </div>
              </div>

              <div class="pt-2">
                <button type="submit" class="flex w-full justify-center rounded-lg bg-primary px-3 py-2.5 text-sm font-semibold text-primary-foreground shadow-sm hover:opacity-90 transition-opacity">
                  Submit for Approval
                </button>
              </div>
            </form>

            <p class="mt-10 text-center text-sm text-muted-foreground">
              Already have an account? 
              <a href="login.html" class="font-semibold leading-6 text-foreground hover:underline">Log in</a>
            </p>
          </div>
        </div>
      </div>

      <div class="relative hidden w-0 flex-1 lg:block bg-muted">
        <img class="absolute inset-0 h-full w-full object-cover" src="https://images.unsplash.com/photo-1591799264318-7e6ef8ddb7ea?auto=format&fit=crop&w=1200&q=80" alt="Repair technician inspecting a device with a magnifying lamp" />
        <div class="absolute inset-0 bg-primary/20 backdrop-blur-[2px]"></div>
      </div>
      
    </div>
  </body>
</html>
