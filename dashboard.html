<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Technician Dashboard | FixTrack Admin</title>
    <meta name="description" content="Manage ongoing repairs, update ticket statuses, and log technician notes in real time." />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  </head>
  <body>
    <div class="flex min-h-screen bg-background">
      <aside class="hidden w-60 shrink-0 border-r border-border bg-surface p-4 lg:block flex flex-col justify-between">
        <div>
          <nav class="space-y-1">
            <button class="flex w-full items-center gap-3 rounded-lg bg-secondary px-3 py-2 text-sm font-medium text-foreground transition-colors">
              <i data-lucide="layout-dashboard" class="h-4 w-4 shrink-0"></i>
              <span class="flex-1 text-left">Dashboard</span>
              <i data-lucide="chevron-right" class="h-4 w-4"></i>
            </button>
            <a href="404.html" class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-sm text-muted-foreground transition-colors hover:bg-secondary/60">
              <i data-lucide="package" class="h-4 w-4 shrink-0"></i>
              <span class="flex-1 text-left">Inventory</span>
            </a>
            <a href="404.html" class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-sm text-muted-foreground transition-colors hover:bg-secondary/60">
              <i data-lucide="users" class="h-4 w-4 shrink-0"></i>
              <span class="flex-1 text-left">Customers</span>
            </a>
          </nav>
          
          <!-- Sidebar GitHub Button (Desktop Only) -->
          <div class="mt-6 border-t border-border pt-4">
             <a href="https://github.com/Reiux/fixtrack-web" target="_blank" rel="noopener noreferrer" class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-sm text-muted-foreground transition-colors hover:bg-secondary/60">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4 shrink-0"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.03c3.15-.38 6.5-1.4 6.5-7.17A5.5 5.5 0 0 0 19 5.9a5.5 5.5 0 0 0-.1-3s-1.1-.3-3.5 1.3a11.5 11.5 0 0 0-6 0C7.1 2.6 6 2.9 6 2.9a5.5 5.5 0 0 0-.1 3 5.5 5.5 0 0 0-1.5 4.8c0 5.7 3.35 6.79 6.5 7.17A4.8 4.8 0 0 0 9 18v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
              <span class="flex-1 text-left">GitHub Repo</span>
            </a>
          </div>
        </div>
        
        <a href="index.html" class="mt-6 block border-t border-border pt-4 text-xs text-muted-foreground hover:text-foreground">
          ← Back to public site
        </a>
      </aside>

      <div class="flex min-w-0 flex-1 flex-col">
        <header class="grid grid-cols-[minmax(0,1fr)_auto] items-center gap-4 border-b border-border px-4 py-3 sm:px-6 md:grid-cols-[auto_1fr_auto]">
          <a href="index.html" class="order-1 flex min-w-0 items-center gap-2">
            <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-primary text-primary-foreground">
              <i data-lucide="wrench" class="h-4 w-4"></i>
            </span>
            <span class="truncate font-display text-lg font-bold">FixTrack</span>
          </a>

          <div class="relative order-3 col-span-full w-full md:order-2 md:col-span-1 md:max-w-md md:justify-self-center">
            <i data-lucide="search" class="pointer-events-none absolute top-1/2 left-3 h-4 w-4 -translate-y-1/2 text-muted-foreground"></i>
            <label for="admin-search" class="sr-only">Search tickets or customers...</label>
            <input
              id="admin-search"
              type="text"
              placeholder="Search tickets or customers..."
              class="w-full rounded-lg border border-input bg-card py-2 pr-3 pl-9 text-sm outline-none focus:ring-2 focus:ring-ring"
            />
          </div>

          <!-- Removed GitHub button from top bar, kept strictly in sidebar and mobile menu -->
          <div class="order-2 flex items-center gap-2 justify-self-end sm:gap-3 md:order-3">
            <button type="button" data-theme-toggle aria-label="Toggle dark mode" class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-lg border border-border bg-card text-muted-foreground transition-colors hover:bg-secondary hover:text-foreground"></button>
            <i data-lucide="bell" class="h-4 w-4 text-muted-foreground hidden sm:block"></i>
            <div class="hidden text-right sm:block">
              <p class="text-sm font-semibold">Admin</p>
            </div>
            <img src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=crop&w=100&q=80" alt="Admin" class="h-8 w-8 rounded-full object-cover border border-border" />
            <button type="button" id="mobile-menu-btn" class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-lg border border-border bg-card text-muted-foreground transition-colors hover:bg-secondary hover:text-foreground lg:hidden">
              <i data-lucide="menu" class="h-4 w-4"></i>
            </button>
          </div>

          <nav id="mobile-menu" class="hidden order-4 col-span-full w-full flex-col gap-1 border-t border-border pt-4 lg:hidden">
            <!-- Mobile Menu GitHub Button -->
            <a href="https://github.com/Reiux/fixtrack-web" target="_blank" rel="noopener noreferrer" class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-sm text-muted-foreground transition-colors hover:bg-secondary/60">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4 shrink-0"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.03c3.15-.38 6.5-1.4 6.5-7.17A5.5 5.5 0 0 0 19 5.9a5.5 5.5 0 0 0-.1-3s-1.1-.3-3.5 1.3a11.5 11.5 0 0 0-6 0C7.1 2.6 6 2.9 6 2.9a5.5 5.5 0 0 0-.1 3 5.5 5.5 0 0 0-1.5 4.8c0 5.7 3.35 6.79 6.5 7.17A4.8 4.8 0 0 0 9 18v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
              <span class="flex-1 text-left">GitHub Repo</span>
            </a>
            <button class="flex w-full items-center gap-3 rounded-lg bg-secondary px-3 py-2 text-sm font-medium text-foreground transition-colors">
              <i data-lucide="layout-dashboard" class="h-4 w-4 shrink-0"></i>
              <span class="flex-1 text-left">Dashboard</span>
            </button>
            <a href="404.html" class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-sm text-muted-foreground transition-colors hover:bg-secondary/60">
              <i data-lucide="package" class="h-4 w-4 shrink-0"></i>
              <span class="flex-1 text-left">Inventory</span>
            </a>
            <a href="index.html" class="mt-4 block border-t border-border pt-4 text-xs text-muted-foreground hover:text-foreground">
              ← Back to public site
            </a>
          </nav>
        </header>

        <!-- Rest of the dashboard content -->
        <main class="min-w-0 flex-1 p-4 sm:p-8">
           <h1 class="text-3xl font-bold sm:text-4xl">Technician Dashboard</h1>
           <!-- (Dashboard Content from previous step stays the same, metrics are handled by script.js) -->
           <div class="mt-8 grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
            <div class="panel p-5">
              <div class="flex items-start justify-between gap-3">
                <p class="text-sm font-bold text-muted-foreground">Total Active Repairs</p>
                <i data-lucide="wrench" class="h-5 w-5 shrink-0 text-muted-foreground"></i>
              </div>
              <p id="metric-active" class="mt-2 text-3xl font-bold">--</p>
            </div>
            <div class="panel p-5">
              <div class="flex items-start justify-between gap-3">
                <p class="text-sm font-bold text-muted-foreground">Pending Pickup</p>
                <i data-lucide="check-circle-2" class="h-5 w-5 shrink-0 text-muted-foreground"></i>
              </div>
              <p id="metric-pickup" class="mt-2 text-3xl font-bold">--</p>
            </div>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
