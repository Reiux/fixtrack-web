<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Technician Login | FixTrack</title>
    <meta name="description" content="Secure login portal for FixTrack repair technicians." />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  </head>
  <body class="bg-background">
    <div class="flex min-h-screen">
      
      <div class="flex w-full flex-col justify-center px-4 py-12 sm:px-6 lg:w-1/2 lg:flex-none lg:px-20 xl:px-24">
        <div class="mx-auto w-full max-w-sm lg:w-96">
          <div class="flex items-center gap-2">
            <span class="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-primary text-primary-foreground">
              <i data-lucide="wrench" class="h-4 w-4"></i>
            </span>
            <span class="font-display text-xl font-bold">FixTrack</span>
          </div>
          
          <h2 class="mt-8 text-2xl font-bold leading-9 tracking-tight">Sign in to your account</h2>
          <p class="mt-2 text-sm text-muted-foreground">
            Internal console for active repair management.
          </p>

          <div class="mt-10">
            <form action="dashboard.html" method="GET" class="space-y-6">
              <div>
                <label for="email" class="block text-sm font-medium leading-6">Email Address</label>
                <div class="mt-2">
                  <input id="email" name="email" type="email" autocomplete="email" required class="block w-full rounded-lg border border-input bg-card py-2.5 px-3 text-sm outline-none focus:ring-2 focus:ring-ring" />
                </div>
              </div>

              <div>
                <label for="password" class="block text-sm font-medium leading-6">Password</label>
                <div class="mt-2">
                  <input id="password" name="password" type="password" autocomplete="current-password" required class="block w-full rounded-lg border border-input bg-card py-2.5 px-3 text-sm outline-none focus:ring-2 focus:ring-ring" />
                </div>
                <div class="mt-2 flex items-center justify-end">
                  <a href="#" class="text-xs font-semibold text-primary hover:underline">Forgot password?</a>
                </div>
              </div>

              <div>
                <button type="submit" class="flex w-full justify-center rounded-lg bg-primary px-3 py-2.5 text-sm font-semibold text-primary-foreground shadow-sm hover:opacity-90 transition-opacity">
                  Sign in
                </button>
              </div>
            </form>

            <p class="mt-10 text-center text-sm text-muted-foreground">
              New technician? 
              <a href="register.html" class="font-semibold leading-6 text-foreground hover:underline">Request access here</a>
            </p>
          </div>
        </div>
        
        <div class="mx-auto mt-12 w-full max-w-sm lg:w-96">
            <a href="index.html" class="inline-flex items-center gap-2 text-sm text-muted-foreground hover:text-foreground transition-colors">
                <i data-lucide="arrow-left" class="h-4 w-4"></i> Back to public site
            </a>
        </div>
      </div>

      <div class="relative hidden w-0 flex-1 lg:block bg-muted">
        <img class="absolute inset-0 h-full w-full object-cover" src="https://images.unsplash.com/photo-1581092160562-40aa08e78837?auto=format&fit=crop&w=1200&q=80" alt="Technician repairing electronic device motherboard" />
        <div class="absolute inset-0 bg-primary/20 backdrop-blur-[2px]"></div>
      </div>
      
    </div>
  </body>
</html>
